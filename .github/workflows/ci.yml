name: Node.js CI/CD pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

  deploy-job:
    needs: test-job
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to EC2 via native SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Remove hidden enter/spaces from EC2_HOST
          CLEAN_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '\n\r ')
          
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa ubuntu@${CLEAN_HOST} << 'EOF'
            # 1. Install Node.js if it doesn't exist
            if ! command -v npm &> /dev/null; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
          
            # 2. Clone repo if it doesn't exist
            if [ ! -d "/home/ubuntu/node-ec2-cicd-poc" ]; then
              git clone https://github.com/sukhwalpavan/node-ec2-cicd-poc.git /home/ubuntu/node-ec2-cicd-poc
            fi
            
            # 3. Pull latest code
            cd /home/ubuntu/node-ec2-cicd-poc
            git pull origin main
            npm install
            
            # 4. Ensure pm2 is installed
            if ! command -v pm2 &> /dev/null; then
              sudo npm install -g pm2
            fi
            
            # 5. Restart or start app
            pm2 restart poccicd-app || pm2 start index.js --name "poccicd-app"
          EOF
